<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AgilityPro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#2563EB', secondary: '#F97316', dark: '#1F2937', darker: '#111827' }, fontFamily: { heading: ['Bebas Neue', 'sans-serif'], body: ['Inter', 'sans-serif'] } } } }
    </script>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-darker dark:text-gray-100 antialiased transition-colors duration-300 min-h-screen flex items-center justify-center p-4">

    <!-- Theme/RTL Toggles (Floating) -->
    <div class="fixed top-6 right-6 flex gap-2 z-50">
        <button id="theme-toggle" class="p-2 bg-white dark:bg-dark border border-gray-200 dark:border-gray-800 rounded-full shadow-lg hover:text-primary transition-colors">
            <i data-lucide="moon" class="w-5 h-5 dark:hidden"></i>
            <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
        </button>
        <button id="rtl-toggle" class="px-3 py-1.5 text-xs font-bold bg-white dark:bg-dark border border-gray-200 dark:border-gray-800 rounded-full shadow-lg hover:text-primary transition-all uppercase tracking-tighter" aria-label="Toggle RTL">
            RTL
        </button>
    </div>

    <div class="max-w-md w-full">
        <!-- Logo -->
        <div class="text-center mb-8">
            <a href="index.html" class="inline-flex items-center gap-2 group">
                <div class="p-3 bg-primary rounded-xl group-hover:bg-secondary transition-colors duration-300 shadow-lg shadow-primary/20">
                    <i data-lucide="dog" class="w-8 h-8 text-white"></i>
                </div>
                <span class="font-heading text-3xl tracking-wider text-gray-900 dark:text-white uppercase mt-1">Agility<span class="text-primary">Pro</span></span>
            </a>
        </div>

        <!-- Auth Card -->
        <div class="bg-white dark:bg-dark rounded-3xl shadow-2xl border border-gray-100 dark:border-gray-800 p-8 md:p-10 reveal">
            <div class="text-center mb-8">
                <h1 class="font-heading text-4xl uppercase tracking-wide mb-2">Welcome Back</h1>
                <p class="text-gray-500 dark:text-gray-400">Please enter your details to sign in</p>
            </div>

            <!-- Social Login -->
            <div class="grid grid-cols-2 gap-4 mb-8">
                <button class="flex items-center justify-center gap-2 py-3 px-4 bg-gray-50 dark:bg-darker border border-gray-200 dark:border-gray-700 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5" alt="Google">
                    <span class="text-sm font-semibold">Google</span>
                </button>
                <button class="flex items-center justify-center gap-2 py-3 px-4 bg-gray-50 dark:bg-darker border border-gray-200 dark:border-gray-700 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
                    <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                        <path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.039 2.48-4.5 2.597-4.571-1.428-2.09-3.623-2.324-4.402-2.376-1.844-.143-3.511 1.13-4.398 1.13zm.884-2.324c.793-.961 1.337-2.3 1.194-3.636-1.156.052-2.545.766-3.376 1.74-.74.844-1.39 2.221-1.207 3.532 1.285.104 2.597-.676 3.389-1.636z" />
                    </svg>
                    <span class="text-sm font-semibold">Apple</span>
                </button>
            </div>

            <div class="relative mb-8 text-center">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-gray-200 dark:border-gray-700"></div>
                </div>
                <span class="relative px-4 bg-white dark:bg-dark text-gray-400 text-xs uppercase tracking-widest">Or continue with</span>
            </div>

            <!-- Login Form -->
            <form action="index.html" class="space-y-5">
                <div>
                    <label for="email" class="block text-sm font-semibold mb-2 ml-1">Email Address</label>
                    <div class="relative">
                        <i data-lucide="mail" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400"></i>
                        <input type="email" id="email" placeholder="name@example.com" class="w-full pl-12 pr-4 py-3 bg-gray-50 dark:bg-darker border border-gray-200 dark:border-gray-700 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all dark:text-white" required>
                    </div>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-2 ml-1">
                        <label for="password" class="block text-sm font-semibold">Password</label>
                        <a href="#" class="text-xs font-bold text-primary hover:text-secondary transition-colors">Forgot?</a>
                    </div>
                    <div class="relative">
                        <i data-lucide="lock" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400"></i>
                        <input type="password" id="password" placeholder="••••••••" class="w-full pl-12 pr-12 py-3 bg-gray-50 dark:bg-darker border border-gray-200 dark:border-gray-700 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all dark:text-white" required>
                        <button type="button" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-primary">
                            <i data-lucide="eye" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>

                <div class="flex items-center gap-2 ml-1">
                    <input type="checkbox" id="remember" class="w-4 h-4 rounded border-gray-300 text-primary focus:ring-primary">
                    <label for="remember" class="text-sm text-gray-500 dark:text-gray-400">Keep me signed in</label>
                </div>

                <button type="submit" class="w-full py-4 bg-primary text-white font-heading text-xl tracking-wider rounded-xl shadow-lg shadow-primary/30 hover:bg-blue-700 hover:-translate-y-0.5 transition-all">Sign In</button>
            </form>

            <div class="text-center mt-8 pt-8 border-t border-gray-100 dark:border-gray-800">
                <p class="text-gray-500 dark:text-gray-400">Don't have an account? <a href="signup.html" class="text-primary font-bold hover:text-secondary transition-colors">Sign up for free</a></p>
            </div>
        </div>

        <div class="text-center mt-8">
            <a href="index.html" class="text-sm font-semibold text-gray-500 hover:text-primary transition-colors inline-flex items-center gap-2">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Homepage
            </a>
        </div>
    </div>

    <script>
        // Lucide Icons
        lucide.createIcons();

        // Theme Toggle
        const themeToggle = document.getElementById('theme-toggle');
        const html = document.documentElement;
        
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            html.classList.add('dark');
        } else {
            html.classList.remove('dark');
        }

        themeToggle.addEventListener('click', () => {
            html.classList.toggle('dark');
            localStorage.theme = html.classList.contains('dark') ? 'dark' : 'light';
        });

        // RTL Toggle
        const rtlToggle = document.getElementById('rtl-toggle');
        rtlToggle.addEventListener('click', () => {
            const isRtl = html.dir === 'rtl';
            html.dir = isRtl ? 'ltr' : 'rtl';
            localStorage.dir = html.dir;
        });

        if (localStorage.dir) {
            html.dir = localStorage.dir;
        }

        // Simple Reveal
        setTimeout(() => {
            document.querySelector('.reveal').classList.add('active');
        }, 100);
    </script>
</body>
</html>
